
server {
    listen 80;

    server_name ballindata.com www.ballindata.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ballindata.com www.ballindata.com;

    ssl_certificate /etc/letsencrypt/live/ballindata.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ballindata.com/privkey.pem;

    location /static/ {
        alias /app/staticfiles/;
        autoindex on;
    }

    location / {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        if ($http_referer ~* "binance\.com") {
            return 403;
        }
    }
}
